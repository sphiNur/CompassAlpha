# CompassAlpha CI (M1.9, 2026-05-07; expanded M1.9-extra 2026-05-07)
#
# Two jobs in one file:
#
#   1. unit
#        Migration journal consistency, i18n catalog parity, workspace
#        type-check, all unit tests EXCEPT the PG-gated integration suite.
#        Runs on every push + PR; ~45-90s warm.
#
#   2. integration
#        Spins up a real Postgres 16 service, applies migrations,
#        runs the PG-gated tests (full-lifecycle, store-scoped-admin,
#        refreshTokens service, cancel-run-cascade, rls-isolation).
#        Runs on every push + PR; ~2-3min cold.
#
# Why two jobs:
#   - unit fails fast on dumb errors (missing key, type drift). Devs
#     see red within ~60s without paying for a Postgres boot.
#   - integration is the safety net that catches schema drift, replay
#     defence, RLS isolation. Worth every second.
#
# What we DON'T run here:
#   - Browser smokes (browser-smoke.ts, browser-smoke-deep.ts) hit the
#     live Cloudflare URL via Playwright. Belongs in deploy.ts gated on
#     a green CI run, not on every PR (would double-bill the tunnel
#     and noise the prod URL).
#
# Concurrency: cancel in-progress runs on the same branch when a new
# commit lands.

name: CI

# 2026-07-26: widened from `push: [main]` to every branch.
#
# With main-only triggers a feature branch had ZERO gating — the
# codex/procurement-collaboration-history-expenses branch sat 59 commits
# behind main for weeks, was the branch the primary dev checkout was
# sitting on (and therefore what deploy.ts would have shipped), and had
# never had a single CI run against it. Since deploy.ts tars the working
# directory rather than a git ref, "CI is green on main" says nothing
# about what is actually running in production unless every branch a
# human might deploy from is also checked.
#
# The concurrency group below already cancels superseded runs per ref,
# so the marginal cost is roughly one run per branch push.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ Job 1: fast unit + type checks ============
  unit:
    name: type-check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No Postgres in this job — skip the PG-gated tests.
      SKIP_PG_TESTS: '1'
      DATABASE_URL: postgres://compass:compass@localhost:5432/compass_test
      JWT_SECRET: ci-test-jwt-access-secret-aaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-aaaaaaaaaaaaaaaaaa

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install bun (matches .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Migration journal consistency
        # `packages/db/src/migrate.ts` runs this check before applying
        # migrations on the server. Hoist it to CI so a missing journal
        # entry (the bug that broke 0009 in prod for a week) fails fast.
        run: |
          node -e "
            const { readFileSync, readdirSync } = require('fs');
            const j = JSON.parse(readFileSync('packages/db/migrations/meta/_journal.json', 'utf8'));
            const tags = new Set(j.entries.map(e => e.tag));
            const sqls = readdirSync('packages/db/migrations').filter(f => /^\d{4}_.*\.sql$/.test(f)).map(f => f.replace(/\.sql$/, ''));
            const orphans = sqls.filter(t => !tags.has(t));
            const ghosts = [...tags].filter(t => !sqls.includes(t));
            if (orphans.length || ghosts.length) {
              console.error('orphans:', orphans);
              console.error('ghosts:', ghosts);
              process.exit(1);
            }
            console.log('migration journal consistent:', sqls.length, 'files');
          "

      - name: i18n catalog parity
        # Each catalog must have the same key count as en.ts. The
        # CatalogKey type already enforces "no extra keys", but a
        # missing key in ru/uz/zh would silently fall back to the
        # English literal at runtime. Cheap grep-based check.
        run: |
          en=$(grep -cE "^  '[a-z]" packages/i18n/src/catalogs/en.ts)
          for lang in zh ru uz; do
            count=$(grep -cE "^  '[a-z]" packages/i18n/src/catalogs/$lang.ts)
            if [ "$count" != "$en" ]; then
              echo "i18n DRIFT: en has $en keys, $lang has $count"
              exit 1
            fi
          done
          echo "i18n parity: $en keys × 4 langs"

      - name: ICU plural sanity
        # 2026-07-30. Two failure modes, both of which shipped and neither of
        # which any existing check could see:
        #
        #   1. `format()` used to DISCARD plural blocks, replacing
        #      `{n, plural, one {# role} other {# roles}}` with the bare count.
        #      24 keys in en / 20 in ru / 8 in uz were authored in ICU form
        #      anyway, so English and Russian silently rendered "3" where they
        #      meant "3 contributors". zh has no plural blocks at all (Chinese
        #      doesn't inflect for number) — which is exactly why the primary
        #      locale looked perfect the whole time.
        #
        #   2. A CLDR *category* case whose body hardcodes a digit:
        #      `one {1 role}`. Russian's `one` covers 1, 21, 31, 101 …, so
        #      n=21 rendered "1 role". 8 ru keys + 1 en key had this.
        #
        # The engine is fixed and unit-tested (packages/i18n plural.test.ts).
        # This grep is the cheap guard against (2) creeping back in a new key:
        # inside a category case the count must come from `#` or `{n}`.
        run: |
          bad=$(grep -nE "\b(one|few|many|other) \{[^#{]*[0-9]" \
            packages/i18n/src/catalogs/*.ts || true)
          if [ -n "$bad" ]; then
            echo "ICU plural: category case hardcodes a digit instead of # / {n}:"
            echo "$bad"
            echo
            echo "In ru, 'one' also matches 21/31/101 — a literal 1 renders wrong."
            exit 1
          fi
          echo "ICU plural: category cases all reference the count ✓"

      - name: Untranslated-literal guard
        # 2026-07-30. The parity check above is blind to the failure mode
        # that actually shipped: strings that never became KEYS. The
        # 2026-07-30 flow walkthrough found 124 English literals rendering
        # inside an otherwise-Chinese UI — `Edit` / `Archive` / `+ New SKU`
        # buttons, `Archive SKU "x"?` confirms, and every string
        # @compass/ui renders itself (QtyControl's quick-pick sheet was
        # entirely English, and that's the app's most-used interaction).
        #
        # Started as a ratchet (baseline 124) so CI wasn't red from day one.
        # The backlog was cleared in three passes and the count reached 0, so
        # it is now a hard gate: any anchored untranslated literal fails.
        run: bun run scripts/check-untranslated.ts

      - name: Typography drift guard
        # M3.13 (2026-05-16): SectionLabel is the single source of truth
        # for the eyebrow style ("text-label font-semibold uppercase
        # tracking-eyebrow text-fg-muted"). Inline copies of that class
        # string sneak back via copy-paste and drift on spacing/
        # markup (h3 mb-2 vs div vs span). This check fails CI if any
        # call site outside SectionLabel.tsx ships the raw class
        # combination. The single legitimate exception is
        # OrderPage:1026 (estimate header) where the eyebrow label sits
        # next to a big-money sibling — documented inline.
        run: |
          # Look for the FULL class string. Allow:
          #   - SectionLabel.tsx (the primitive defines it)
          #   - any line preceded by an `// eslint-disable-next-line`
          #     comment (the OrderPage exception)
          violations=$(
            grep -rn "text-label font-semibold uppercase tracking-eyebrow text-\[var(--c-fg-muted)\]" \
              apps/web/src packages/ui/src 2>/dev/null \
              | grep -v "SectionLabel.tsx" || true
          )
          if [ -z "$violations" ]; then
            echo "typography: SectionLabel is the only eyebrow renderer ✓"
            exit 0
          fi
          # Cross-check against allow-listed exception lines.
          allow_lines=$(grep -rn "M3.13 typography exception" apps/web/src packages/ui/src 2>/dev/null || true)
          unexplained=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file=$(echo "$line" | cut -d: -f1)
            lineno=$(echo "$line" | cut -d: -f2)
            # Find any "M3.13 typography exception" comment within 8 lines above.
            prev_start=$((lineno - 8))
            if [ $prev_start -lt 1 ]; then prev_start=1; fi
            context=$(sed -n "${prev_start},${lineno}p" "$file")
            if ! echo "$context" | grep -q "M3.13 typography exception"; then
              unexplained="$unexplained\n$line"
            fi
          done <<< "$violations"
          if [ -n "$unexplained" ]; then
            echo "typography DRIFT: inline eyebrow class outside SectionLabel:"
            echo -e "$unexplained"
            echo ""
            echo "Migrate to <SectionLabel padded={false}>...</SectionLabel> or"
            echo "add a '// M3.13 typography exception:' comment above the line"
            echo "explaining why the inline pattern is required."
            exit 1
          fi
          echo "typography: $(echo "$violations" | wc -l) allow-listed exception(s) ✓"

      - name: Capsule size-ladder guard
        # UI-11 (2026-07-31, Telegram-capsule pass). Every control height
        # is a fixed fraction of the 32px Telegram chrome capsule:
        # 20 / 28 / 32 / 40 / 48 / 56 / 64. Before this pass the app had
        # accumulated h-7, h-9, h-11 and h-[52px] as ad-hoc "looked right
        # here" heights, which is why a Chip, a QtyControl and a Segmented
        # sitting in one row were three different sizes.
        #
        # Bans the off-ladder Tailwind height steps and the raw Tailwind
        # text scale (text-xs/sm/base/lg/xl/2xl/3xl) — type is semantic
        # (text-h2 / text-body / text-label …) so it can shift with the
        # scale instead of being re-typed per call site. Arbitrary
        # h-[Npx] is caught separately below.
        #
        # h-5 (20, micro tier), h-8 (32), h-10 (40), h-12 (48), h-14 (56),
        # h-16 (64) are the legal literals; prefer the token
        # (--control-h-xs / --capsule-h / --control-h / --control-h-lg).
        # h-11 (44) is banned as a literal on purpose — the 44px `touch`
        # tier is restricted to state-committing controls in a scrolling
        # dense list, so it must be spelled --control-h-touch, which
        # makes the deliberate choice greppable.
        run: |
          bad=$(
            grep -rEn "(^|[\"' ])(h|min-h)-(7|9|11|13)([\"' ]|$)|(^|[\"' ])text-(xs|sm|base|lg|xl|2xl|3xl)([\"' ]|$)" \
              apps/web/src packages/ui/src \
              --include='*.tsx' --include='*.ts' 2>/dev/null \
              | grep -vE "^[^:]+:[0-9]+: *(//|\*|/\*)" \
              | grep -v 'UI-11 exception' || true
          )
          # Arbitrary pixel heights in the CONTROL range (>= 20px) that
          # aren't a ladder tier. Sub-20px is decorative (dots, drag
          # handles, hairlines) and not on the control ladder, so the
          # two-digit prefix deliberately skips it.
          badpx=$(
            grep -rEn "h-\[[0-9]{2,}px\]" apps/web/src packages/ui/src \
              --include='*.tsx' --include='*.ts' 2>/dev/null \
              | grep -vE "^[^:]+:[0-9]+: *(//|\*|/\*)" \
              | grep -vE "h-\[(20|28|32|40|44|48|56|64)px\]" \
              | grep -v 'UI-11 exception' || true
          )
          if [ -n "$bad" ] || [ -n "$badpx" ]; then
            echo "UI-11 size-ladder violation (see docs/UI_STANDARDS.md):"
            [ -n "$bad" ] && echo "$bad"
            [ -n "$badpx" ] && echo "$badpx"
            echo ""
            echo "Heights are fixed fractions of the 32px Telegram capsule:"
            echo "  20 micro | 28 --control-h-xs | 32 --capsule-h | 40 --control-h"
            echo "  48 --control-h-lg | 56 header | 64 nav"
            echo "Type is semantic: text-h1/h2/h3/body/body-sm/label/tiny."
            echo "Genuine exception? Add a '// UI-11 exception: <reason>' comment"
            echo "on the same line."
            exit 1
          fi
          echo "UI-11: every control height is on the capsule ladder ✓"

      - name: Spacing-grid guard
        # UI-11 (spacing half). The vertical rhythm is 4px, with
        # Tailwind's 0.5 (2px) and 1.5 (6px) allowed as INLINE nudges
        # between adjacent inline elements. The `2.5` step (10px) is
        # neither: it is the "split the difference" value people reach
        # for when a block feels a pixel off, and it is exactly how the
        # app ended up with py-2 / py-2.5 / py-3 versions of the same
        # row. Ban the 10px step so block padding lands on 8 or 12.
        run: |
          bad=$(
            grep -rEn "(^|[\"' ])(p|px|py|m|mx|my|mt|mb|ml|mr|gap|gap-x|gap-y|space-x|space-y)-2\.5([\"' ]|$)" \
              apps/web/src packages/ui/src \
              --include='*.tsx' --include='*.ts' 2>/dev/null \
              | grep -vE "^[^:]+:[0-9]+: *(//|\*|/\*)" \
              | grep -v 'UI-11 exception' || true
          )
          if [ -n "$bad" ]; then
            echo "UI-11 spacing violation: the 10px (2.5) step is not on the grid."
            echo "$bad"
            echo ""
            echo "Use 2 (8px) or 3 (12px) for block padding. 0.5/1.5 stay"
            echo "available for inline nudges between inline elements."
            exit 1
          fi
          echo "UI-11: block spacing on the 4px grid ✓"

      - name: Hardcoded-color guard
        # UI-8 (2026-07-31). Raw oklch()/hex inside a Tailwind arbitrary
        # value silently breaks dark theme — the literal doesn't move
        # when the theme swaps. Badge, Banner and Toast each carried
        # their OWN copy of the status tints this way, drifted against
        # each other (success bg 95% vs 96%, warn ink 40/35/38%), and
        # rendered near-black-on-black in the dark theme. They now read
        # --c-*-bg / --c-*-fg tokens.
        #
        # Excludes: tokens.css (where the literals belong), boot.css
        # (pre-React shell, loads before the token sheet), ErrorBoundary
        # (var(--x, #hex) fallbacks that must survive a CSS load
        # failure), and canvas/2D fillStyle (image data, not UI).
        run: |
          bad=$(
            grep -rEn "\[oklch\(|(bg|text|ring|border|fill|stroke|from|to|via)-(white|black)([\"' /]|$)|\[#[0-9a-fA-F]{3,8}\]" \
              apps/web/src packages/ui/src \
              --include='*.tsx' --include='*.ts' 2>/dev/null \
              | grep -vE "^[^:]+:[0-9]+: *(//|\*|/\*)" \
              | grep -v 'ErrorBoundary.tsx' \
              | grep -v 'UI-8 exception' || true
          )
          if [ -n "$bad" ]; then
            echo "UI-8 hardcoded-color violation (see docs/UI_STANDARDS.md):"
            echo "$bad"
            echo ""
            echo "Use a token: --c-fg / --c-fg-muted / --c-capsule / --c-surface-2 /"
            echo "--c-success-bg + --c-success-fg / --c-warn-bg + --c-warning-fg /"
            echo "--c-danger-bg + --c-danger-fg / --c-scrim(-strong) / --c-on-scrim."
            echo "Genuine exception? Add a '// UI-8 exception: <reason>' comment"
            echo "on the same line."
            exit 1
          fi
          echo "UI-8: no hardcoded colors outside the token sheet ✓"

      - name: Dead Tailwind opacity-modifier guard
        # 2026-07-31. Tailwind v3 cannot apply an opacity modifier to an
        # arbitrary var() color: for `bg-[var(--c-action)]/10` it emits
        # NO rule at all. The class looks right in review, passes
        # type-check, and renders nothing.
        #
        # Two shipped bugs found by diffing the built CSS during the
        # capsule pass:
        #   - OrderPage's current-batch row was tinted with
        #     bg-[var(--c-action)]/10 → no tint, current batch
        #     indistinguishable from the others.
        #   - Button `danger-ghost` used ring-[var(--c-danger)]/40 → the
        #     color class vanished but `ring-1` kept its width, so every
        #     soft-destructive button in Admin drew Tailwind's DEFAULT
        #     BLUE ring around red text.
        #
        # Fix: use a real token for the tint (--c-info-bg /
        # --c-danger-bg / --c-warn-bg / --c-success-bg / --c-capsule),
        # which also gets you a dark-theme value.
        run: |
          bad=$(
            grep -rEn "\[var\(--[a-z0-9-]+\)\]/[0-9]+" \
              apps/web/src packages/ui/src \
              --include='*.tsx' --include='*.ts' 2>/dev/null \
              | grep -vE "^[^:]+:[0-9]+: *(//|\*|/\*)" || true
          )
          if [ -n "$bad" ]; then
            echo "Dead Tailwind class: opacity modifier on an arbitrary var() color."
            echo "$bad"
            echo ""
            echo "Tailwind emits no CSS for these. Use a tint token instead:"
            echo "  --c-capsule / --c-info-bg / --c-warn-bg / --c-success-bg / --c-danger-bg"
            exit 1
          fi
          echo "no dead opacity-modifier classes ✓"

      - name: Type-check
        run: pnpm type-check

      # ESLint flat config + plugin wiring (react-hooks, jsx-a11y) and
      # the cleanup of legacy eslint-disable comment formats are an M2
      # follow-up. apps/web/eslint.config.js is in place as the starting
      # point. The per-PR safety net today: type-check above + the
      # console.log grep below + the migration journal / i18n parity /
      # typography drift checks already enforced in this same job.

      - name: No console.log in user-facing code
        # M3.18 (launch hardening): a leftover console.log(tsv) in
        # AdminPage.tsx leaked exported CSV rows to the browser
        # console. This guard ensures that pattern can't reappear
        # silently in the SPA or the API request path.
        #
        # SCOPE intentionally excludes:
        #   - apps/bot/src and apps/worker/src — these are independent
        #     Bun processes whose stdout IS their log output (captured
        #     by systemd journal). console.log there is the canonical
        #     way to emit operational lines like '[worker] heartbeat'.
        #   - __tests__ — test harness output is fine.
        #   - ErrorBoundary.tsx — last-resort console.error fallback.
        # console.warn / console.error are NOT flagged (legitimate
        # warning paths in long-running code).
        run: |
          set -e
          found=$(
            grep -rEn 'console\.(log|debug|info)\(' \
              apps/web/src apps/api/src \
              --include='*.ts' --include='*.tsx' 2>/dev/null \
              | grep -v '__tests__' \
              | grep -v 'ErrorBoundary.tsx' \
              | grep -v 'eslint-disable' \
              || true
          )
          if [ -n "$found" ]; then
            echo "console.log / console.debug / console.info found in user-facing code:"
            echo "$found"
            echo ""
            echo "Use the structured logger from @compass/telemetry instead,"
            echo "or wrap in 'if (import.meta.env.DEV) { ... }' for dev-only diagnostics."
            echo "If this is a legitimate use case, add an // eslint-disable-next-line no-console"
            echo "comment with rationale on the line above."
            exit 1
          fi
          echo "no stray console.log / debug / info in web/api/packages ✓"

      - name: Unit tests (non-PG)
        run: |
          bun test \
            packages/domain \
            apps/api \
            apps/web/src/lib \
            apps/web/src/hooks \
            apps/web/src/pages

  # ============ Job 2: PG-backed integration tests ============
  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        # Health check — GitHub waits for the service to be reachable
        # before starting steps. Without this the migrate step races
        # the postgres boot and intermittently fails.
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://compass:compass@localhost:5432/compass_test
      # Tests + migrate read these from env. Values just need to exist
      # and be ≥ 32 chars for the JWT layer; not used to verify real
      # tokens here.
      JWT_SECRET: ci-test-jwt-access-secret-aaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-aaaaaaaaaaaaaaaaaa
      TELEGRAM_BOT_TOKEN: ci-stub:bot
      # Don't skip — we WANT the PG-gated tests to run here.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install bun (matches .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        # Same runner the deploy script uses. Order: PRE raw SQL →
        # drizzle generated SQL → POST raw SQL (RLS policies). Idempotent.
        run: pnpm --filter @compass/db migrate

      - name: Create non-owner test role
        # The service POSTGRES_USER owns the schema and is a superuser,
        # so it bypasses RLS even when tables FORCE ROW LEVEL SECURITY.
        # Integration tests use this non-owner, non-BYPASSRLS role to
        # exercise the same policy path as the application user.
        run: |
          pnpm --filter @compass/db exec bun - <<'EOF'
          import postgres from 'postgres';

          const db = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
          await db.unsafe(`
            DO $$
            BEGIN
              CREATE ROLE compass_ci_app LOGIN PASSWORD 'compass_ci_app' NOSUPERUSER NOBYPASSRLS;
            EXCEPTION WHEN duplicate_object THEN
              ALTER ROLE compass_ci_app WITH LOGIN PASSWORD 'compass_ci_app' NOSUPERUSER NOBYPASSRLS;
            END $$;

            GRANT USAGE ON SCHEMA auth, inventory, domain, read_model, ops, sync, public TO compass_ci_app;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA auth, inventory, domain, read_model, ops, sync TO compass_ci_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA auth, inventory, domain, read_model, ops, sync TO compass_ci_app;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth, inventory, domain, read_model, ops, sync, public TO compass_ci_app;
          `);
          await db.end({ timeout: 5 });
          EOF

      - name: Integration tests
        env:
          DATABASE_URL: postgres://compass_ci_app:compass_ci_app@localhost:5432/compass_test
        # SKIP_PG_TESTS unset → PG-gated tests run for real.
        run: |
          bun test \
            apps/api/src/__tests__/full-lifecycle.test.ts \
            apps/api/src/__tests__/store-scoped-admin.test.ts \
            apps/api/src/__tests__/refreshTokens.test.ts \
            apps/api/src/__tests__/cancel-run-cascade.test.ts \
            apps/api/src/__tests__/rls-isolation.test.ts
