# CompassAlpha CI (M1.9, 2026-05-07; expanded M1.9-extra 2026-05-07)
#
# Jobs:
#
#   1. unit
#        Migration journal consistency, workspace type-check (a key
#        missing from a catalog fails here), the i18n and UI guards, all
#        unit tests EXCEPT the PG-gated integration suite.
#        Runs on every push + PR; ~45-90s warm.
#
#   2. integration
#        Spins up a real Postgres 18 service, applies migrations, runs
#        every PG-gated test in apps/api and apps/worker as a role that
#        owns nothing and is subject to RLS.
#        Runs on every push + PR; ~2-3min cold.
#
# Why two jobs:
#   - unit fails fast on dumb errors (missing key, type drift). Devs
#     see red within ~60s without paying for a Postgres boot.
#   - integration is the safety net that catches schema drift, replay
#     defence, RLS isolation. Worth every second.
#
#   3. e2e
#        Drives the real app in Chromium against a real api and database
#        (tests/e2e). Runs on every push + PR; ~2min.
#
# What we DON'T run here:
#   - Browser smokes (browser-smoke.ts, browser-smoke-deep.ts) hit the
#     live Cloudflare URL via Playwright. Belongs in deploy.ts gated on
#     a green CI run, not on every PR (would double-bill the tunnel
#     and noise the prod URL).
#
# Concurrency: cancel in-progress runs on the same branch when a new
# commit lands.

name: CI

# 2026-07-26: widened from `push: [main]` to every branch.
#
# With main-only triggers a feature branch had ZERO gating — the
# codex/procurement-collaboration-history-expenses branch sat 59 commits
# behind main for weeks, was the branch the primary dev checkout was
# sitting on (and therefore what deploy.ts would have shipped), and had
# never had a single CI run against it. Since deploy.ts tars the working
# directory rather than a git ref, "CI is green on main" says nothing
# about what is actually running in production unless every branch a
# human might deploy from is also checked.
#
# The concurrency group below already cancels superseded runs per ref,
# so the marginal cost is roughly one run per branch push.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ Job 1: fast unit + type checks ============
  unit:
    name: type-check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No Postgres in this job — skip the PG-gated tests.
      SKIP_PG_TESTS: '1'
      DATABASE_URL: postgres://compass:compass@localhost:5432/compass_test
      JWT_SECRET: ci-test-jwt-access-secret-aaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-aaaaaaaaaaaaaaaaaa

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install bun (matches .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Migration journal consistency
        # `packages/db/src/migrate.ts` runs this check before applying
        # migrations on the server. Hoist it to CI so a missing journal
        # entry (the bug that broke 0009 in prod for a week) fails fast.
        run: |
          node -e "
            const { readFileSync, readdirSync } = require('fs');
            const j = JSON.parse(readFileSync('packages/db/migrations/meta/_journal.json', 'utf8'));
            const tags = new Set(j.entries.map(e => e.tag));
            const sqls = readdirSync('packages/db/migrations').filter(f => /^\d{4}_.*\.sql$/.test(f)).map(f => f.replace(/\.sql$/, ''));
            const orphans = sqls.filter(t => !tags.has(t));
            const ghosts = [...tags].filter(t => !sqls.includes(t));
            if (orphans.length || ghosts.length) {
              console.error('orphans:', orphans);
              console.error('ghosts:', ghosts);
              process.exit(1);
            }
            console.log('migration journal consistent:', sqls.length, 'files');
          "

      - name: Untranslated-literal guard
        # 2026-07-30. The catalog checks (type-check, catalog lint) are
        # blind to the failure mode that actually shipped: strings that
        # never became KEYS. The 2026-07-30 flow walkthrough found 124
        # English literals rendering inside an otherwise-Chinese UI —
        # `Edit` / `Archive` / `+ New SKU` buttons, `Archive SKU "x"?`
        # confirms, and every string @compass/ui renders itself
        # (QtyControl's quick-pick sheet was entirely English, and that's
        # the app's most-used interaction).
        #
        # Started as a ratchet (baseline 124) so CI wasn't red from day one.
        # The backlog was cleared in three passes and the count reached 0, so
        # it is now a hard gate: any anchored untranslated literal fails.
        run: bun run scripts/check-untranslated.ts

      - name: Typography guard (no uppercase labels)
        # UI-11 (docs/UI_STANDARDS.md, 2026-11-05): section and field
        # labels are sentence case. Uppercase is meaningless in zh, hard to
        # read in ru/uz, and every hand-rolled "uppercase tracking-eyebrow"
        # copy drifted in size. SectionLabel / FieldLabel are the label
        # renderers; nothing styles text uppercase.
        run: |
          violations=$(grep -rnE "className=.*\buppercase\b|'[^']*\buppercase\b[^']*'" \
            --include=*.tsx --include=*.ts apps/web/src packages/ui/src 2>/dev/null \
            | grep -v "__tests__" || true)
          if [ -n "$violations" ]; then
            echo "typography: uppercase label styling (use SectionLabel / FieldLabel, sentence case):"
            echo "$violations"
            exit 1
          fi
          echo "typography: no uppercase labels ✓"

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        # Every workspace package (OPS-19); the shared rules are in
        # eslint.shared.mjs. React code: rules-of-hooks, and exhaustive-deps
        # except for a baseline of older web files (apps/web/eslint.config.js).
        # The rest reads the types: a promise nobody awaits or catches fails
        # the build. no-console everywhere but where the console is the
        # output (worker, bot, command-line tools, tests).
        run: pnpm lint

      - name: Startup JavaScript budget
        # DX-PFE-2 (2026-11-01): the scripts every cold start downloads
        # (entry chunk + modulepreloads) were 183 KB gzip, with the English
        # catalog and two pages in them. One static import brings that
        # back; fail when they pass the budget in scripts/check-entry-budget.ts.
        run: |
          pnpm --filter @compass/web exec vite build --outDir "$RUNNER_TEMP/web-dist" --emptyOutDir --logLevel warn
          bun run scripts/check-entry-budget.ts "$RUNNER_TEMP/web-dist"

      - name: Unit tests (non-PG)
        run: |
          bun test \
            packages/domain \
            packages/contracts \
            packages/db \
            packages/i18n \
            packages/ui \
            apps/api \
            apps/worker \
            apps/web/src \
            scripts

  # ============ Job 2: PG-backed integration tests ============
  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        # Health check — GitHub waits for the service to be reachable
        # before starting steps. Without this the migrate step races
        # the postgres boot and intermittently fails.
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://compass:compass@localhost:5432/compass_test
      # Tests + migrate read these from env. Values just need to exist
      # and be ≥ 32 chars for the JWT layer; not used to verify real
      # tokens here.
      JWT_SECRET: ci-test-jwt-access-secret-aaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-aaaaaaaaaaaaaaaaaa
      TELEGRAM_BOT_TOKEN: ci-stub:bot
      # Don't skip — we WANT the PG-gated tests to run here.

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install bun (matches .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Every migration is pending on a new database
        # Review OPS-10: the deploy takes a backup first when
        # `migrate --pending` lists anything. This step and the one after
        # "Apply migrations" hold that list to what drizzle applies.
        run: |
          listed=$(pnpm --filter @compass/db migrate --pending | grep -c '^pending: ' || true)
          journal=$(jq '.entries | length' packages/db/migrations/meta/_journal.json)
          echo "pending: $listed of $journal"
          test "$listed" -eq "$journal"

      - name: Apply migrations
        # Same runner the deploy script uses. Order: PRE raw SQL →
        # drizzle generated SQL → POST raw SQL (RLS policies). Idempotent.
        run: pnpm --filter @compass/db migrate

      - name: Nothing is pending after migrating
        run: |
          out=$(pnpm --filter @compass/db migrate --pending)
          echo "$out"
          if grep -q '^pending: ' <<<"$out"; then
            echo "migrate --pending still lists entries after a migrate"
            exit 1
          fi

      - name: Create non-owner test role
        # The service POSTGRES_USER owns the schema and is a superuser,
        # so it bypasses RLS even when tables FORCE ROW LEVEL SECURITY.
        # Integration tests use this non-owner, non-BYPASSRLS role to
        # exercise the same policy path as the application user.
        run: |
          pnpm --filter @compass/db exec bun - <<'EOF'
          import postgres from 'postgres';

          const db = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
          await db.unsafe(`
            DO $$
            BEGIN
              CREATE ROLE compass_ci_app LOGIN PASSWORD 'compass_ci_app' NOSUPERUSER NOBYPASSRLS;
            EXCEPTION WHEN duplicate_object THEN
              ALTER ROLE compass_ci_app WITH LOGIN PASSWORD 'compass_ci_app' NOSUPERUSER NOBYPASSRLS;
            END $$;

            GRANT USAGE ON SCHEMA auth, inventory, domain, read_model, ops, sync, public TO compass_ci_app;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA auth, inventory, domain, read_model, ops, sync TO compass_ci_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA auth, inventory, domain, read_model, ops, sync TO compass_ci_app;
            GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth, inventory, domain, read_model, ops, sync, public TO compass_ci_app;
          `);
          await db.end({ timeout: 5 });
          EOF

      - name: Integration tests
        env:
          DATABASE_URL: postgres://compass_ci_app:compass_ci_app@localhost:5432/compass_test
        # SKIP_PG_TESTS unset → PG-gated tests run for real.
        # 2026-10-21 audit CA-13: run the whole test directories instead of
        # a hand-kept file list — invite-acceptance, multi-tenant and
        # subscription were silently never run. Tests that sign Telegram
        # initData use the stub TELEGRAM_BOT_TOKEN above as their own key.
        # Review TEST4-17 (2026-11): the worker's claim-timeout SQL tests
        # too; they had only ever run on a developer's machine.
        run: |
          bun test \
            apps/api/src/__tests__ \
            apps/api/src/services/__tests__ \
            apps/worker/src

      - name: The tests left nothing behind
        # Review TEST1-07 (2026-11): each PG test removes the organisations
        # and users it made (apps/api/src/__tests__/helpers/cleanup.ts).
        # Only an organisation that holds daily-close revisions stays, with
        # its members: those revisions are kept for good. Anything else
        # here was made by a test that does not clean up after itself.
        run: |
          pnpm --filter @compass/db exec bun - <<'EOF'
          import postgres from 'postgres';

          const db = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
          const kept = db`
            SELECT DISTINCT org_id FROM inventory.store_daily_settlement_revisions`;
          const orgs = await db`
            SELECT slug FROM auth.organizations WHERE id NOT IN (${kept}) ORDER BY slug`;
          const users = await db`
            SELECT display_name FROM auth.users u
            WHERE NOT EXISTS (
              SELECT 1 FROM auth.members m WHERE m.user_id = u.id AND m.org_id IN (${kept})
            )
            ORDER BY display_name`;
          await db.end({ timeout: 5 });
          console.log(`left behind: ${orgs.length} organisations, ${users.length} users`);
          for (const o of orgs.slice(0, 20)) console.log(`  organisation ${o.slug}`);
          for (const u of users.slice(0, 20)) console.log(`  user ${u.display_name}`);
          if (orgs.length > 0 || users.length > 0) process.exit(1);
          EOF

  # ============ Job 3: the app in a real browser ============
  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # global-setup wipes and rebuilds this database on every run.
      E2E_DATABASE_URL: postgres://compass:compass@localhost:5432/compass_e2e

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install bun (matches .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @compass/e2e exec playwright install --with-deps chromium

      - name: Walk the main flow
        # Real api, real database, web dev server, development login.
        # Order → approve → buy → deliver → receive → finish → daily close.
        run: pnpm test:e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  # ============ Job 4: a nightly dump restores ============
  restore-drill:
    name: backup and restore drill (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install bun (matches .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Postgres 18 client tools
        # pg_dump refuses a server newer than itself, and the runner's is
        # older; the server runs 18 (CLAUDE.md).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Back up, restore, compare
        # Review OPS-11 (2026-11-10): no restore had ever been tried. The
        # nightly script dumps a database set up the way production has
        # it, restore.sh puts the dump into a new database, and the two
        # must match; then the restored one is dumped again and swapped
        # in (infra/backup/drill.sh).
        env:
          DRILL_ADMIN_URL: postgres://compass:compass@localhost:5432/postgres
        run: |
          pg_dump --version
          bash infra/backup/drill.sh
