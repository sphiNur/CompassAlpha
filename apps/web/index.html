<!doctype html>
<!--
  <html lang> is intentionally empty here — /boot-guard.js sets it
  on load based on the Telegram / navigator locale (zh / ru / uz / en).
  React's I18nProvider may further narrow it after auth resolves.
-->
<html lang>
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover enables env(safe-area-inset-*) on iOS notches.
      We deliberately DO NOT set maximum-scale / user-scalable=no — that
      violates WCAG 2.1 SC 1.4.4 (Resize Text). Telegram WebView passes
      pinch-zoom through to the page; users with low vision rely on it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Adaptive theme-color for light + dark schemes. The previous
         fixed #ffffff caused a white notch strip in dark mode. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Build id, replaced by Vite at build time. Client polls
         /health/version and compares; mismatch shows a reload prompt. -->
    <meta name="compass-build" content="%VITE_BUILD_SHA%" />
    <title>Compass</title>
    <link rel="stylesheet" href="/boot.css" />
    <!-- Telegram WebApp SDK. Listed in CSP's script-src whitelist
         (the only third-party script we accept). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Boot guard: locale detection + error capture + 12s failsafe
         + Reload / Reset button wiring. External per CSP. -->
    <script src="/boot-guard.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div id="boot-spinner" aria-hidden="true"></div>
        <div class="boot-title">Compass</div>
        <div class="boot-subtitle" data-boot-starting>Starting up…</div>
        <div id="boot-error" role="alert">
          <strong data-msg>Boot failed</strong>
          <pre></pre>
          <div class="boot-actions">
            <button id="boot-reload-btn" class="boot-btn" type="button">Reload</button>
            <button id="boot-reset-btn" class="boot-btn boot-btn-secondary" type="button">
              Reset &amp; reload
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
