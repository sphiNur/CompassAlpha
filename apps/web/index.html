<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Build id, replaced by Vite at build time. Client polls
         /health/version and compares; mismatch shows a reload prompt. -->
    <meta name="compass-build" content="%VITE_BUILD_SHA%" />
    <title>Compass</title>
    <style>
      /* Pre-React shell. If the JS module fails to load (iOS WebView quirks,
       * CDN block, etc.) the user still sees something instead of a blank
       * black screen. The .ready class is added by main.tsx on successful
       * mount, hiding the splash. */
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1c1e; color: #f5f5f7; }
      }
      #boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        text-align: center; padding: 24px;
        transition: opacity 200ms ease;
      }
      .ready #boot-splash { opacity: 0; pointer-events: none; }
      #boot-spinner {
        width: 28px; height: 28px;
        border: 3px solid currentColor; border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 900ms linear infinite;
        opacity: 0.5;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot-error {
        display: none; max-width: 480px; padding: 16px 20px;
        background: rgba(255, 59, 48, 0.08); color: #d70015;
        border-radius: 14px; font-size: 14px; line-height: 1.5;
        text-align: left; word-break: break-word;
      }
      #boot-error.show { display: block; }
      #boot-error pre {
        margin: 8px 0 0; font-size: 11px; max-height: 30vh; overflow: auto;
        white-space: pre-wrap; word-break: break-word;
      }
      .boot-btn {
        appearance: none; padding: 10px 20px; border-radius: 9999px;
        background: #0066cc; color: white; border: 0; font-size: 15px;
        font-weight: 500; cursor: pointer;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Boot guard: if no module load completes in 8 s OR a global error fires,
      // surface it in the splash so the user isn't staring at a blank screen.
      (function () {
        var bootShown = false;
        function showBootError(msg, stack) {
          if (bootShown) return;
          bootShown = true;
          var el = document.getElementById('boot-error');
          if (!el) return;
          el.classList.add('show');
          el.querySelector('[data-msg]').textContent = msg || 'Failed to start';
          if (stack) el.querySelector('pre').textContent = stack;
          var spin = document.getElementById('boot-spinner');
          if (spin) spin.style.display = 'none';
        }
        window.addEventListener('error', function (e) {
          showBootError(e.message || 'Script error', (e.error && e.error.stack) || '');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason || {};
          showBootError(r.message || 'Unhandled rejection', r.stack || String(r));
        });
        // Failsafe: if React still hasn't replaced the splash after 12 s,
        // force the error UI so the user can recover.
        setTimeout(function () {
          if (!document.documentElement.classList.contains('ready')) {
            showBootError('App did not start within 12 s. Likely a JS module loading error.', '');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div id="boot-spinner" aria-hidden="true"></div>
        <div style="font-size: 17px; font-weight: 600;">Compass</div>
        <div style="font-size: 13px; opacity: 0.55;">Starting up…</div>
        <div id="boot-error" role="alert">
          <strong data-msg>Boot failed</strong>
          <pre></pre>
          <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="boot-btn" onclick="location.reload()">Reload</button>
            <button class="boot-btn" style="background: transparent; color: inherit; border: 1px solid currentColor;" onclick="try { localStorage.removeItem('compass.auth'); sessionStorage.clear(); } catch(e){}; location.reload();">Reset & reload</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
