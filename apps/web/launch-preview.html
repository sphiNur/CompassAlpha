<!doctype html>
<!--
  Claude Desktop Launch panel preview redirect (dev-only, not for prod).

  Why this exists:
    Launch panel opens HTML files as static assets — it does not run
    Vite. Our real index.html references /src/main.tsx (TypeScript)
    which the browser cannot execute without Vite transpiling. The
    boot-guard correctly catches the module load failure and shows
    "Boot failed", but the user never sees the real SPA.

  This file is a 1-line redirect to http://localhost:5173, the URL
  Vite dev server actually serves. Open THIS file in the Launch
  panel; it will immediately bounce to Vite. From there everything
  works — HMR, real TS transpile, Telegram SDK init.

  Prereq: vite must be running. Start it with:
      cd CompassAlpha
      pnpm --filter @compass/web dev
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=http://localhost:5173" />
    <title>Compass — redirecting to Vite dev server…</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        gap: 16px;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1c1e; color: #f5f5f7; }
      }
      h1 { font-size: 17px; font-weight: 600; margin: 0; }
      p { font-size: 13px; opacity: 0.6; margin: 0; }
      a { color: #0066cc; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
    <script>
      // JS redirect is instant; meta-refresh above is the no-JS fallback.
      window.location.replace('http://localhost:5173');
    </script>
  </head>
  <body>
    <h1>Compass</h1>
    <p>Redirecting to Vite dev server…</p>
    <p>
      If nothing happens, open <a href="http://localhost:5173">http://localhost:5173</a>
      manually, and make sure <code>pnpm --filter @compass/web dev</code> is running.
    </p>
  </body>
</html>
