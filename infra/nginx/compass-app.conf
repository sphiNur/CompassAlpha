# The production nginx site (/etc/nginx/sites-enabled/app). Review OPS-23:
# kept here so a route the api serves is never left out again. Every path
# the api answers outside /trpc/ needs its own location below: on
# 2026-11-15 POST /csp-report got nginx's 405 and the attendance export
# link got the SPA page, as neither was forwarded.
# apps/api/src/__tests__/nginx-config.test.ts checks the api's routes
# against this file. Install: copy to /etc/nginx/sites-enabled/app, then
# `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/compass.access.log;
    error_log  /var/log/nginx/compass.error.log warn;

    root /home/ubuntu/compass-alpha/apps/web/dist;
    index index.html;

    # Long-cache hashed assets (their filenames change on every build).
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
    }

    # tRPC routes
    location /trpc/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # CSP violation reports (apps/api/src/http/cspReport.ts).
    location = /csp-report {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Signed download links (the attendance month spreadsheet).
    location /files/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health + version are ALWAYS fresh
    location /health/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA shell — never cache. Belt-and-suspenders against iOS WebView.
    location / {
        try_files $uri $uri/ /index.html;
        # Make iOS Telegram WebView fetch fresh every time:
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Tell intermediaries (Cloudflare) not to cache HTML either.
        add_header Surrogate-Control "no-store" always;
    }
}
